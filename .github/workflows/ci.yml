name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/build.properties
            project/plugins.sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Compile
        run: sbt compile

      - name: Scalafmt
        run: sbt scalafmtCheckAll scalafmtSbtCheck

      - name: Scalafix
        run: sbt "scalafix --check"

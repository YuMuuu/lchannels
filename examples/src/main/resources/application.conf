GreetingServerSys {
  akka {
    loglevel = OFF # To preserve readability, when ActorSystems disconnect
    log-dead-letters-during-shutdown = off
    
    actor {
      provider = remote
      allow-java-serialization = on
      warn-about-java-serializer-usage = false
    }
    
    remote {
      artery {
        transport = tcp
        canonical.hostname = "127.0.0.1"
        canonical.port = 31337
      }
    }
  }
}

